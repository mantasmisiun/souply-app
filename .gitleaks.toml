# Extends the built-in rule set rather than replacing it, so new default
# rules arrive with a gitleaks upgrade instead of needing a copy-paste.
[extend]
useDefault = true

[[allowlists]]
description = "Template files carry placeholders by definition"
paths = [
  '''\.env\.(example|sample|template)$''',
  '''\.gitleaks\.toml$''',
]

[[allowlists]]
description = """Android client keys ship inside every APK by design. They are \
protected by package-name and signing-certificate restrictions rather than by \
being secret, which is what Google recommends."""
paths = [
  '''google-services\.json$''',
  '''android/app/debug\.keystore$''',
]
